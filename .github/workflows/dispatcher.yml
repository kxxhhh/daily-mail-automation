name: mail-dispatcher

# 自愈式调度器：每 5 分钟 tick 一次，tick 内自行判断“现在是否该发”。
# 相比把发送时间赌在某个 cron 触发点上，本方案每个时段有 8 个冗余 tick，
# 只要任意一个 tick 被调度到（即使延迟），邮件就会发出；闸门保证不重复发送。
#
# 判定逻辑（北京时间）：
#   - 作文时段：05/08/11/14/17/20/23 时的 :30（每天 7 封）
#   - 高考倒计时：05 时的 :30（每天 1 封）
#   - tick 落在 :20-:29 → 精确等到 :30 再发（准点）
#   - tick 落在 :30-:59 且闸门未命中 → 立即补发（最多晚 29 分钟）
#   - tick 落在 :00-:19 → 本 tick 跳过（后续 tick 会处理）
#   - 时段闸门（state/*_slot_gate.json，随仓库提交）保证同一时段只发一封
on:
  workflow_dispatch:
    inputs:
      force_essay:
        description: "立即发送作文邮件（时段闸门仍生效，不会重复）"
        type: boolean
        default: false
      force_gaokao:
        description: "立即发送高考倒计时邮件（时段闸门仍生效，不会重复）"
        type: boolean
        default: false
      ignore_gate:
        description: "连闸门也忽略（确认未收到邮件后的强制重发，可能重复！）"
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mail-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Quick skip (stdlib only)
        env:
          FORCE_ESSAY: ${{ inputs.force_essay }}
          FORCE_GAOKAO: ${{ inputs.force_gaokao }}
          IGNORE_GATE: ${{ inputs.ignore_gate }}
        run: |
          # 第一段判定：纯标准库、不装依赖。非发送窗口（时段小时的 :20-:59 之外）直接跳过，
          # 省掉 pip install + 完整判定的开销（全天大部分 tick 走这里）。
          python3 - <<'EOF'
          import os
          from datetime import datetime, timedelta, timezone
          BJT = timezone(timedelta(hours=8))
          SEND_HOURS = {5, 8, 11, 14, 17, 20, 23}  # 含高考的 05 时
          force = (os.environ.get("FORCE_ESSAY") == "true"
                   or os.environ.get("FORCE_GAOKAO") == "true"
                   or os.environ.get("IGNORE_GATE") == "true")
          now = datetime.now(BJT)
          skip = not force and (now.hour not in SEND_HOURS or now.minute < 20)
          with open(os.environ["GITHUB_ENV"], "a") as ef:
              ef.write(f"QUICK_SKIP={'true' if skip else 'false'}\n")
          if skip:
              print(f"北京时间 {now:%H:%M} 非发送窗口，本 tick 快速跳过")
          else:
              print(f"北京时间 {now:%H:%M} 进入发送判定")
          EOF

      - name: Install dependencies
        if: env.QUICK_SKIP != 'true'
        run: pip install -r requirements.txt

      - name: Check due
        if: env.QUICK_SKIP != 'true'
        env:
          FORCE_ESSAY: ${{ inputs.force_essay }}
          FORCE_GAOKAO: ${{ inputs.force_gaokao }}
          IGNORE_GATE: ${{ inputs.ignore_gate }}
        run: |
          python3 - <<'EOF'
          import json, os, time
          from datetime import datetime, timedelta, timezone

          BJT = timezone(timedelta(hours=8))
          ESSAY_HOURS = {5, 8, 11, 14, 17, 20, 23}
          GAOKAO_HOURS = {5}
          force_essay = os.environ.get("FORCE_ESSAY") == "true"
          force_gaokao = os.environ.get("FORCE_GAOKAO") == "true"
          ignore_gate = os.environ.get("IGNORE_GATE") == "true"

          def gate_slot(name):
              try:
                  with open(os.path.join("state", f"{name}_slot_gate.json"), encoding="utf-8") as fh:
                      return json.load(fh).get("slot")
              except Exception:
                  return None

          now = datetime.now(BJT)
          if not (force_essay or force_gaokao or ignore_gate) and now.minute < 30:
              rem = (30 - now.minute) * 60 - now.second
              if 0 < rem <= 600:
                  print(f"北京时间 {now:%H:%M:%S}，等待 {rem} 秒到 :30 准点发送")
                  time.sleep(rem)
                  now = datetime.now(BJT)
              else:
                  print(f"北京时间 {now:%H:%M:%S}，距 :30 超过 10 分钟，本 tick 跳过（后续 tick 处理）")
                  with open(os.environ["GITHUB_ENV"], "a") as ef:
                      ef.write("DUE_ESSAY=false\nDUE_GAOKAO=false\n")
                  raise SystemExit(0)

          slot = now.strftime("%Y-%m-%d %H")
          # force 仅跳过时段判定；闸门始终生效，除非显式 ignore_gate
          due_essay = (force_essay or now.hour in ESSAY_HOURS) and (ignore_gate or gate_slot("essay") != slot)
          due_gaokao = (force_gaokao or now.hour in GAOKAO_HOURS) and (ignore_gate or gate_slot("gaokao") != slot)
          print(f"北京时间 {now:%Y-%m-%d %H:%M} | due_essay={due_essay} | due_gaokao={due_gaokao}")
          with open(os.environ["GITHUB_ENV"], "a") as ef:
              ef.write(f"DUE_ESSAY={'true' if due_essay else 'false'}\n")
              ef.write(f"DUE_GAOKAO={'true' if due_gaokao else 'false'}\n")
          EOF

      - name: Send due mails
        if: env.QUICK_SKIP != 'true'
        env:
          IGNORE_GATE: ${{ inputs.ignore_gate }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          RECEIVER: ${{ secrets.RECEIVER }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          STATE_DIR: ${{ github.workspace }}/state
        run: |
          ARGS_E=""; ARGS_G=""
          # 只有显式 ignore_gate 才绕过脚本内闸门；force_essay/gaokao 不传参数，闸门双重生效
          if [ "$IGNORE_GATE" = "true" ]; then
            ARGS_E="--ignore-gate"
            ARGS_G="--ignore-gate"
          fi
          FAILED=""
          if [ "$DUE_ESSAY" = "true" ]; then
            # 重试（指数退避）：模型 API 偶发 429/读超时；失败发生在发信前，重试不会重复发信
            for i in 1 2 3; do
              echo "=== essay 第 $i/3 次尝试 ==="
              if python scripts/essay_hourly.py $ARGS_E; then break; fi
              if [ "$i" -lt 3 ]; then
                sleep $((i * 45))
              else
                FAILED="$FAILED essay"
              fi
            done
          fi
          if [ "$DUE_GAOKAO" = "true" ]; then
            for i in 1 2 3; do
              echo "=== gaokao 第 $i/3 次尝试 ==="
              if python scripts/gaokao_countdown.py $ARGS_G; then break; fi
              if [ "$i" -lt 3 ]; then
                sleep $((i * 45))
              else
                FAILED="$FAILED gaokao"
              fi
            done
          fi
          if [ -n "$FAILED" ]; then
            echo "发送失败的任务:$FAILED"
            exit 1
          fi

      - name: Persist state
        if: always() && env.QUICK_SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "状态无变化"
            exit 0
          fi
          git commit -m "chore: update mail state [skip ci]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 失败，拉取远端后重试（第 $i 次）"
            git pull --rebase -X theirs origin master || git reset --hard origin/master
            git add state
            git diff --cached --quiet && { echo "远端已包含相同状态"; exit 0; }
            git commit -m "chore: update mail state [skip ci]" || true
            sleep 5
          done
          echo "push 连续 3 次失败"
          exit 1

      - name: Chain next tick
        # 自链式调度：schedule 事件在本仓库实测不触发（2026-11-14 观察 2h45m 零注册），
        # 改为每次运行收尾时休眠到下一个 5 分钟刻度、再用 DISPATCH_TOKEN 触发下一次运行。
        # on.schedule 保留作为备用种子：若它哪天恢复工作，也只会触发额外 tick，
        # 闸门保证不重复发送，链式步骤会因排队数 >=2 自动不再补种。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          # 已有 >=2 个 dispatcher 运行在排队/执行中 → 链路健康，不重复补种
          PENDING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20" \
            | python3 -c "import json,sys; rs=json.load(sys.stdin)['workflow_runs']; print(sum(1 for r in rs if r['name']=='mail-dispatcher' and r['status']!='completed'))")
          if [ "${PENDING:-0}" -ge 2 ]; then
            echo "链路健康（${PENDING} 个运行未完成），本次不补种"
            exit 0
          fi
          WAIT=$(( 300 - $(date +%s) % 300 + 10 ))
          echo "等待 ${WAIT}s 后触发下一次 tick（当前未完成 ${PENDING} 个）"
          sleep "$WAIT"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/dispatcher.yml/dispatches" \
              -d '{"ref":"master"}')
            echo "dispatch HTTP $CODE"
            if [ "$CODE" = "204" ]; then
              echo "链路：下一次 tick 已触发"
              exit 0
            fi
            sleep 20
          done
          echo "ERROR: 链式触发连续失败，链路将在本次运行后中断（需手动 Run workflow 重新播种）"
          exit 1
