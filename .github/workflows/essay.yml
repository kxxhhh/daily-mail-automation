name: essay-mail

on:
  workflow_dispatch:
    inputs:
      force:
        description: "忽略时段闸门与时间窗口，强制发送（测试用）"
        type: boolean
        default: false
  # 北京时间 05:30 / 08:30 / 11:30 / 14:30 / 17:30 / 20:30 / 23:30
  # （对应 UTC 21:30(前一日) / 00:30 / 03:30 / 06:30 / 09:30 / 12:30 / 15:30）
  # 自愈式定时：HH:20 主触发（等待到 HH:30 准点发送）；HH:35 / HH:50 为备份触发，
  # 仅当主触发丢失或失败时补发（延迟 5 / 20 分钟）。
  # 脚本内有时段闸门（同一北京小时只发一封），备份触发命中闸门会直接跳过，
  # 因此多触发不会重复发送。闸门状态随 state/ 提交回仓库，跨运行可见。
  schedule:
    - cron: "20,35,50 0,3,6,9,12,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: essay-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait until slot (Beijing HH:30)
        run: |
          # 计算距下一个整点 ：30 的秒数并等待（最长 13 分钟）；已过 ：30 则直接发送
          python3 - <<'EOF'
          import time
          now = time.time()
          gm = time.gmtime(now)
          if gm.tm_min < 30:
              # 对齐到本小时 :30（UTC 与北京目标时间均为整点后 30 分钟）
              target = now + (29 - gm.tm_min) * 60 + (60 - gm.tm_sec)
              sleep_s = min(int(target - now), 780)
              if sleep_s > 0:
                  print(f"等待 {sleep_s} 秒后准点发送")
                  time.sleep(sleep_s)
          else:
              print("已过 ：30，立即发送")
          EOF

      - name: Generate and send
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          RECEIVER: ${{ secrets.RECEIVER }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: glm-4.7-flash
          STATE_DIR: ${{ github.workspace }}/state
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          # 自动重试（指数退避）：模型 API 偶发 429/读超时，最多尝试 3 次；失败发生在发信前，重试不会重复发信
          for i in 1 2 3; do
            echo "=== 第 $i/3 次尝试 ==="
            if python scripts/essay_hourly.py $ARGS; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              WAIT=$((i * 45))
              echo "第 $i 次失败，${WAIT} 秒后重试"
              sleep $WAIT
            fi
          done
          echo "连续 3 次失败，放弃"
          exit 1

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore: update essay state [skip ci]"
            git push
          fi
