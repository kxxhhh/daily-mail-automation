name: essay-mail

on:
  workflow_dispatch:
    inputs:
      force:
        description: "忽略时段闸门与时间窗口，强制发送（测试用）"
        type: boolean
        default: false
  # 定时发送由 mail-dispatcher.yml 每 5 分钟巡检触发（自愈式，见该文件说明）。
  # 本文件仅保留手动触发作为备用/测试入口。

permissions:
  contents: write

concurrency:
  group: essay-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          RECEIVER: ${{ secrets.RECEIVER }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # 不设置 ZHIPU_MODEL：让脚本使用默认降级链 glm-4.7-flash → glm-4.5-flash → glm-4-flash-250414
          STATE_DIR: ${{ github.workspace }}/state
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          # 自动重试（指数退避）：模型 API 偶发 429/读超时，最多尝试 3 次；失败发生在发信前，重试不会重复发信
          for i in 1 2 3; do
            echo "=== 第 $i/3 次尝试 ==="
            if python scripts/essay_hourly.py $ARGS; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              WAIT=$((i * 45))
              echo "第 $i 次失败，${WAIT} 秒后重试"
              sleep $WAIT
            fi
          done
          echo "连续 3 次失败，放弃"
          exit 1

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore: update essay state [skip ci]"
            git push
          fi
