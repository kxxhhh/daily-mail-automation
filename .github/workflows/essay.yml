name: essay-mail

on:
  workflow_dispatch:
  # 说明：GitHub 原生 schedule 是 best-effort，常延迟数小时或丢失，
  # 准点发送由本地 Termux cron 负责；此处仅保留手动触发作为备用。
  # schedule:
  #   - cron: "30 0,3,6,9,12,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: essay-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          RECEIVER: ${{ secrets.RECEIVER }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          LONGCAT_MODEL: LongCat-2.5
          STATE_DIR: ${{ github.workspace }}/state
        run: python scripts/essay_hourly.py --force

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore: update essay state [skip ci]"
            git push
          fi
