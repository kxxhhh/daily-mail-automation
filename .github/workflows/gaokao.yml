name: gaokao-countdown

on:
  workflow_dispatch:
  # 北京时间每天 05:30（UTC 21:30）
  # 提前 10 分钟触发，再由“Wait until slot”步骤精确等到 ：30 准点发送；
  # 若触发时已过 ：30，则立即发送，不额外等待。
  schedule:
    - cron: "20 21 * * *"

permissions:
  contents: read

concurrency:
  group: gaokao-countdown
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait until slot (Beijing HH:30)
        run: |
          # 计算距下一个整点 ：30 的秒数并等待（最长 13 分钟）；已过 ：30 则直接发送
          python3 - <<'EOF'
          import time
          now = time.time()
          gm = time.gmtime(now)
          if gm.tm_min < 30:
              target = now + (29 - gm.tm_min) * 60 + (60 - gm.tm_sec)
              sleep_s = min(int(target - now), 780)
              if sleep_s > 0:
                  print(f"等待 {sleep_s} 秒后准点发送")
                  time.sleep(sleep_s)
          else:
              print("已过 ：30，立即发送")
          EOF

      - name: Send countdown
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          RECEIVER: ${{ secrets.RECEIVER }}
        run: |
          # 自动重试：网络/上游偶发超时，最多尝试 3 次（发送失败基本发生在发信前，重试不会重复发信）
          for i in 1 2 3; do
            echo "=== 第 $i/3 次尝试 ==="
            if python scripts/gaokao_countdown.py; then
              exit 0
            fi
            echo "第 $i 次失败，30 秒后重试"
            sleep 30
          done
          echo "连续 3 次失败，放弃"
          exit 1