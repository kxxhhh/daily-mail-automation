name: gaokao-countdown

on:
  workflow_dispatch:
  # 说明：GitHub 原生 schedule 是 best-effort，常延迟数小时或丢失，
  # 准点发送由本地 Termux cron 负责；此处仅保留手动触发作为备用。
  # schedule:
  #   - cron: "30 21 * * *"

permissions:
  contents: read

concurrency:
  group: gaokao-countdown
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send countdown
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          RECEIVER: ${{ secrets.RECEIVER }}
        run: python scripts/gaokao_countdown.py
